# Release: bump `version` in pyproject.toml and npm/package.json (same value), commit, then
#   git tag v0.2.0 && git push origin v0.2.0
# → tests, npm publish (databook-cli, with provenance), GitHub release with the wheel.
# npm auth: repository secret NPM_TOKEN (npm automation token), or npm trusted publishing configured for this
# workflow on npmjs.com (then no secret is needed).
name: release
on:
  push: { tags: ["v*"] }
permissions: { contents: write, id-token: write }
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: "https://registry.npmjs.org" }
      - name: tag, pyproject.toml and npm/package.json agree
        run: |
          v="${GITHUB_REF_NAME#v}"
          test "$(node -p "require('./npm/package.json').version")" = "$v"
          grep -q "^version = \"$v\"" pyproject.toml
      - run: uv run --frozen pytest -q
      - run: npm install -g npm@11 && npm publish --provenance --access public
        working-directory: npm
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
      - run: gh release create "$GITHUB_REF_NAME" npm/dist/*.whl --generate-notes
        env: { GH_TOKEN: "${{ github.token }}" }
