# Every push to main and every PR: Python tests, viewer bundle in sync with web/, npm package installs and runs.
# The docs site (site/) is built and deployed by Vercel's Git integration (preview per PR, production on main).
name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --frozen pytest -q
  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci && npm run build
        working-directory: web
      - name: committed viewer bundle matches web/ sources (run `cd web && npm run build` and commit)
        run: git diff --exit-code --stat -- src/tracebook/viewer/index.html
  npm-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm pack && npm install -g ./tracebook-cli-*.tgz
        working-directory: npm
      - run: tracebook --version && tracebook doctor && tracebook init /tmp/ws && cd /tmp/ws && tracebook check
