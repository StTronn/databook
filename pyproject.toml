[project]
name = "databook"
version = "0.1.0"
description = "Agent-native data notebook: SQL, Python and formula-model blocks over your files, rendered as a traceable report."
requires-python = ">=3.10"
dependencies = ["duckdb>=1.1", "pandas>=2.2", "openpyxl>=3.1", "formualizer>=0.5.8", "pyyaml>=6", "pytz"]

[project.scripts]
databook = "databook.cli:main"

[project.entry-points."databook.packs"]
razorpay = "databook.packs.razorpay:PACK"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/databook"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals/tests"]
