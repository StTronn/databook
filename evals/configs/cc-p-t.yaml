# Setup CC+P+T: CC+P + databook CLI, its skill and a project CLAUDE.md asking for a notebook. Only agents[].skills and the databook mounts may differ across cc*.yaml.
#   evals/run.sh evals/configs/cc-p-t.yaml      (key in evals/.env; add --install-only to test setup without model calls)
job_name: cc-p-t
jobs_dir: evals/jobs
n_attempts: 3
n_concurrent_trials: 3
artifacts: [/app]          # answer.csv + any notebook/workspace the agent leaves behind (inspection, judges)
tasks:
  - path: evals/datasets/data-agent/local329
  - path: evals/datasets/data-agent/log-web-funnel   # local329+330+331+360 as one request
environment:
  mounts:                  # host runtimes (evals/agents/prefetch.py, run by evals/run.sh), read-only; nothing installed per trial
    - {type: bind, source: "${EVALS_RT}/claude", target: /usr/local/bin/claude, read_only: true, bind: {create_host_path: false}}
    - {type: bind, source: "${EVALS_RT}/databook", target: /opt/databook, read_only: true, bind: {create_host_path: false}}
    - {type: bind, source: "${EVALS_DIR}/agents/databook.sh", target: /usr/local/bin/databook, read_only: true, bind: {create_host_path: false}}
    - {type: bind, source: "${EVALS_DIR}/../src/databook/skill", target: /root/.claude/skills/databook, read_only: true, bind: {create_host_path: false}}
    - {type: bind, source: "${EVALS_DIR}/agents/CLAUDE.md", target: /app/CLAUDE.md, read_only: true, bind: {create_host_path: false}}
agents:
  - name: claude-code      # Harbor built-in; skips install since the mounted binary matches `version`
    model_name: anthropic/claude-haiku-4-5
    kwargs:
      version: "2.1.312"         # pinned Claude Code (prefetch mounts this build)
      disable_web_search: true   # no WebSearch/WebFetch (Docker Desktop can't enforce a network allowlist)
    skills:
      - playbooks/data-analysis   # playbook skill, copied into Claude Code's skills/ in the sandbox
